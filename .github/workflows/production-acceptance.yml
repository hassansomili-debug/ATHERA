# ══════════ قبولُ المنتج على الإنتاج المنشور — بوّابةٌ بعد الإصدار ══════════
#
# **لماذا مشغِّلٌ مستقلّ، ولمَ بيدٍ لا تلقائيًّا.**
#
# كانت هذه الرحلةُ خطوةً في `ci.yml` تُشغَّل على `main` بعد الدمج. وذاك
# ترتيبٌ دائريّ: فحصُ المصدر يشترط أن يحمل الإنتاجُ شيفرةً لم تُنشر بعد،
# والنشرُ المحروس لا يقع إلا بعد خضرة الفحص. فوقع ما لا بدّ أن يقع —
# التشغيلة `34754134574` سقطت على `de5e49ac` لأنّ Vercel نشر الوِب عند
# الدمج بينما الخادمُ ما زال `31345edd`.
#
# **والفصلُ يحمل معنًى لا ترتيبًا فقط** (الدليل التشغيليّ §9): إصدارُ البنية
# قد ينجح تقنيًّا وقبولُ المنتج يسقط. وضمُّهما في مشغّلٍ واحد يجعل سقوطَ
# المنتج يبدو سقوطَ نشر، فيُطلب تراجعٌ لا لزوم له — أو يُخفى العكس.
#
# فأربعُ حالاتٍ تبقى متمايزة، ولا تُختزل واحدةٌ في أخرى:
#
#     CODE GREEN                 ← `ci.yml` و`rc-e2e.yml`
#     INFRA RELEASE GREEN        ← `production-release.yml`
#     AUTOMATED PRODUCT ACCEPTANCE GREEN  ← هذا المشغّل
#     PRODUCTION GREEN           ← رحلةُ المالك الذهبية بنفسه، ولا يُؤتمت
name: Production acceptance — authenticated golden journey

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: >-
          الالتزامُ المنشور على الإنتاج الآن — أربعون محرفًا من `main`.
          يُقرأ من تشغيلة الإصدار المحروس التي نجحت للتوّ، لا من الذاكرة.
        required: true
        type: string

# **ولا امتيازَ إلا القراءة.** رحلةُ القبول لا تكتب في المستودع.
permissions:
  contents: read

concurrency:
  # ورحلتان بحسابِ قبولٍ واحد تتنازعان الحسابَ نفسَه.
  group: production-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: Authenticated golden journey on deployed production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      PUBRIVA_ACCEPT_EMAIL: ${{ secrets.PUBRIVA_ACCEPT_EMAIL }}
      PUBRIVA_ACCEPT_PASSWORD: ${{ secrets.PUBRIVA_ACCEPT_PASSWORD }}
    steps:
      # ــ ١ · الالتزامُ بعينه، لا «آخرُ main» ــ
      #
      # ورحلةُ القبول تفحص منتجًا منشورًا، فيجب أن تُشتقّ دعاويها من
      # الشيفرة التي **نُشرت**. و`main` قد يكون تقدّم بعد الإصدار.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_release_sha }}
          fetch-depth: 0

      - name: Refuse a commit that is not a reviewed main commit
        env:
          SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_release_sha must be a full 40-character SHA"
            exit 1
          fi
          git fetch --no-tags origin main
          # **ولا تُقبل شيفرةٌ لم تمرّ بالمراجعة.** التزامٌ خارج `main`
          # قد يكون فرعًا لم يُدمج — وقبولُه يُصادق على ما لم يُراجَع.
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not an ancestor of origin/main — refusing."
            exit 1
          fi
          echo "release commit verified on main: $SHA"

      # ــ ٢ · مصدرانِ لا مصدر: المنتجُ المنشور، وأداةُ الفحص ــ
      #
      # **والخلطُ بينهما كان عطبًا قاتلًا.** شجرةُ العمل هي `expected_release_sha`
      # — المنتجُ المنشورُ الذي يُقبَل — و**ملفّا برهان H2-A ليسا فيه**: هما
      # أحدثُ منه، أُضيفا في دفعةِ الحارس نفسِها. فمحاولةُ تشغيلهما من
      # جذر الشجرة تسقط بـ`No such file or directory` قبل أن يُلمس الإنتاج.
      #
      # ولا يُحَلّ بتبديل الجذر إلى `main`: لو فُعل لَفحصت رحلةُ المتصفّح
      # شيفرةً **غيرَ المنشورة**، وذاك يُبطل معنى القبول من أصله.
      #
      # فالمنتجُ يبقى في الجذر، **وأداةُ الفحص تُستخرَج من `GITHUB_SHA`**
      # — التزامُ المشغّل بعينه، لا فرعًا متحرّكًا — إلى مجلّدٍ منفصل.
      # ويُتحقّق أنّه التزامٌ حقيقيٌّ ومن `main` المُراجَعة.
      - name: Stage the H2-A harness from the workflow commit
        id: harness
        env:
          PRODUCT_SHA: ${{ inputs.expected_release_sha }}
        run: |
          set -euo pipefail
          # والالتزامُ قد لا يكون في المستودع المحلّيّ بعد، فيُجلب ثمّ يُتحقّق.
          git fetch --no-tags origin "${GITHUB_SHA}" 2>/dev/null || true
          if ! git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            echo "::error::the workflow commit ${GITHUB_SHA} is not a reachable commit"
            exit 1
          fi
          # **ولا أداةَ فحصٍ من التزامٍ غيرِ مُراجَع.**
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::the workflow commit ${GITHUB_SHA} is not an ancestor of origin/main"
            exit 1
          fi

          harness="${RUNNER_TEMP}/h2a-harness"
          rm -rf "$harness"
          mkdir -p "$harness"
          chmod 700 "$harness"
          for name in h2a_keyed_replay.py h2a_record_proof.py h2a_cleanup.py; do
            git show "${GITHUB_SHA}:.github/acceptance/${name}" > "${harness}/${name}"
            chmod 600 "${harness}/${name}"
            test -s "${harness}/${name}" \
              || { echo "::error::staged harness ${name} is empty"; exit 1; }
            python3 -m py_compile "${harness}/${name}" \
              || { echo "::error::staged harness ${name} does not compile"; exit 1; }
          done
          echo "harness_dir=${harness}" >> "$GITHUB_OUTPUT"

          # **ويُقال الفرقُ صريحًا في السجلّ** — فلا يُقرأ أحدُهما مكانَ الآخر.
          # وهما غيرُ سرّيَّين، واختلافُهما مقصودٌ في بوّابةٍ أداتُها أحدثُ
          # من المنتج الذي تفحصه.
          echo "PRODUCT_SHA=${PRODUCT_SHA}"
          echo "HARNESS_SHA=${GITHUB_SHA}"
          {
            echo "| revision | commit |"
            echo "|---|---|"
            echo "| product under test (deployed) | \`${PRODUCT_SHA}\` |"
            echo "| acceptance harness (this workflow) | \`${GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # ــ ٢ · البوّابة: لا تشغيلَ باعتمادٍ حتى يأذن المالك ــ
      #
      # **والتخطّي لا يُعدّ نجاحًا.** مشغّلٌ يصمت حين لا يجد اعتمادًا يُقرأ
      # أخضرَ، فيُظنّ المنتجُ مفحوصًا وهو لم يُفحص. فيسقط صراحةً.
      - name: Require the acceptance gate, or fail loudly
        if: ${{ vars.PUBRIVA_ACCEPT_READY != 'true'
                || env.PUBRIVA_ACCEPT_PASSWORD == ''
                || env.PUBRIVA_ACCEPT_EMAIL == '' }}
        run: |
          echo "::error::PRODUCT ACCEPTANCE NOT RUN"
          echo "::error::PUBRIVA_ACCEPT_READY=${{ vars.PUBRIVA_ACCEPT_READY || 'unset' }}"
          echo "::error::this workflow refuses to report success without running."
          echo "::error::set PUBRIVA_ACCEPT_READY=true and provide the dedicated"
          echo "::error::acceptance account secrets, then dispatch again."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web dependencies
        run: cd apps/web && npm ci

      # **ومشغّلُ الفحص يُثبَّت صراحةً** — وغيابُه أسقط التشغيلة `34765368242`.
      #
      # `@playwright/test` **ليست في `apps/web/package.json` عن قصد**: لا Node
      # على جهاز التطوير لإعادة توليد ملف القفل، وإضافةُ الحزمة بلا قفلٍ
      # مطابق تكسر `npm ci` في كلّ مهمّة. فتُثبَّت `--no-save` في كلّ مشغّلٍ
      # يحتاجها — وهذا ما يفعله `ci.yml` و`rc-e2e.yml` بالسطر نفسِه.
      #
      # وكانت هذه الخطوةُ ساقطةً هنا وحدها، فسقط `npm run test:acceptance`
      # بـ`playwright: not found` ورمزِ خروج ١٢٧ — **قبل أن يبلغ المنتجَ
      # أصلًا**. ولم يكن العطبُ في المنتج ولا في دعاوى القبول.
      #
      # والنسخةُ هي النسخةُ المتّبعة في المستودع: تطابق ما يعلنه Next
      # (`peerOptional @playwright/test@^1.51.1`)، وأقدمُ منها يفشل
      # بـERESOLVE. ولا تُستعمل `playwright@1.63.0` التي جلبها `npx` عرضًا —
      # فتلك حزمةُ تنزيلِ متصفّحات لا مشغّلُ فحص.
      - name: Install the Playwright test runner
        run: cd apps/web && npm install --no-save @playwright/test@^1.51.1

      - name: Install Playwright Chromium
        run: cd apps/web && npx playwright install --with-deps chromium

      # ══════════ ٤ · برهانُ الإعادة بمفتاح — قبل المتصفّح ══════════
      #
      # **ولمَ هنا، ولمَ أوّلًا.**
      #
      # رحلةُ المتصفّح تُثبت أنّ المنتجَ لم ينكسر، **ولا تمسّ H2-A بحرف**:
      # الوِبُّ لا يُرسل `Idempotency-Key` بعد، وذاك بندٌ مفتوحٌ مُعلَن. فبقي
      # أنّ بنيةَ تحمُّلِ الإعادة تُنشر ولا يُجرَّب منها شيءٌ على الإنتاج —
      # وحارسُ المخطَّط في `production-release.yml` لا يفحص جدولَها أصلًا.
      #
      # فيُطرق البابُ بطلبٍ حقيقيّ، **وقبل رحلةِ المتصفّح**: لو سقط البرهانُ
      # لَما صحّ أن تُقال «القبولُ أخضر» بأيّ درجة. وهو شرطٌ لا خطوةٌ
      # موازية — ولذلك يقع في المهمّة نفسِها وبترتيبٍ صريح.
      #
      # **والاعتمادُ لا يخرج من المشغّل.** الحسابُ المخصَّصُ للقبول يُقرأ من
      # أسرار GitHub في هذه البيئة وحدها؛ ولا يُطبع بريدٌ ولا كلمةُ مرورٍ
      # ولا رمزٌ ولا المفتاحُ الخام. والمُخرَجاتُ غيرُ سرّيّة: معرّفُ بحثٍ،
      # ومستأجرٌ، وفاعلٌ، وبصمةُ مفتاح.
      - name: H2-A keyed replay smoke (API, deployed production)
        id: keyed
        env:
          PUBRIVA_API_URL: https://athera-api.fly.dev
          SMOKE_MARKER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 "${{ steps.harness.outputs.harness_dir }}/h2a_keyed_replay.py"

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # **والصفُّ يُقرأ من القاعدة، لا يُستنتج من جوابَين.**
      #
      # فجوابانِ متطابقانِ قد يُنتجهما تكرارٌ حقيقيٌّ يُعيد الصفَّ الأوّل
      # عرضًا. فيُفحص الصفُّ نفسُه: واحدٌ، `completed`، ٢٠١، وجوابُه يشير
      # إلى البحث المُنشأ — وبحثٌ واحدٌ في المجال لا اثنان.
      #
      # ويُقرأ **بدور التطبيق وبسياسة الصفّ نافذة**، في معاملةٍ للقراءة
      # فقط يُتحقّق من وضعها. ولا اعتمادَ ترحيلٍ ولا تجاوزَ RLS.
      - name: H2-A durable record proof (read-only, inside the Fly machine)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SMOKE_TENANT_ID: ${{ steps.keyed.outputs.tenant_id }}
          SMOKE_ACTOR_ID: ${{ steps.keyed.outputs.actor_user_id }}
          SMOKE_KEY_DIGEST: ${{ steps.keyed.outputs.key_digest }}
          SMOKE_OPERATION: ${{ steps.keyed.outputs.operation }}
          SMOKE_PROJECT_ID: ${{ steps.keyed.outputs.project_id }}
          HARNESS_DIR: ${{ steps.harness.outputs.harness_dir }}
        run: |
          set -euo pipefail
          payload="$(base64 -w0 "${HARNESS_DIR}/h2a_record_proof.py")"
          # والبيئةُ تُمرَّر بالأسماء، فلا يظهر سرٌّ في سطر الأوامر.
          flyctl ssh console --app athera-api -C "env \
            SMOKE_TENANT_ID=${SMOKE_TENANT_ID} \
            SMOKE_ACTOR_ID=${SMOKE_ACTOR_ID} \
            SMOKE_KEY_DIGEST=${SMOKE_KEY_DIGEST} \
            SMOKE_OPERATION='${SMOKE_OPERATION}' \
            SMOKE_PROJECT_ID=${SMOKE_PROJECT_ID} \
            python3 -c \"import base64;exec(base64.b64decode('${payload}'))\"" \
            | tee /tmp/h2a_record_proof.log
          grep -q "H2A_RECORD_PROOF=pass" /tmp/h2a_record_proof.log

      # **والسلّةُ طريقُ المنتج، لا SQL.** الحذفُ هنا نقلٌ إلى السلّة لا
      # إتلاف (`workspace.trash_project`)، والصفُّ يبقى قابلًا للاستعادة.
      #
      # **ويسقط عند الإخفاق، ولا يُحذّر فقط.** كان تحذيرًا والملخّصُ يقول
      # «نُقل إلى السلّة» على أيّ حال — تقريرٌ كاذب. فبرهانٌ على الإنتاج لا
      # يستطيع إزالةَ أثرِه المعلوم ليس قبولًا كاملَ الخضرة.
      #
      # ويعمل بـ`always()` فيُنظّف أثرَ برهانٍ سقط بعد الإنشاء — **ولا
      # يمحو صنفَ السقوط الأوّل**: ذاك باقٍ في خطوته هو.
      - name: Trash the disposable smoke project (product route)
        id: cleanup
        if: always()
        env:
          PUBRIVA_API_URL: https://athera-api.fly.dev
          SMOKE_PROJECT_ID: ${{ steps.keyed.outputs.project_id }}
          SMOKE_TITLE: ${{ steps.keyed.outputs.smoke_title }}
          HARNESS_DIR: ${{ steps.harness.outputs.harness_dir }}
        run: python3 "${HARNESS_DIR}/h2a_cleanup.py"

      # **ويُمحى الرمزُ قبل أن يعمل المتصفّح.** لا أثرَ يُرفع، ولا ملفَّ
      # اعتمادٍ يعيش إلى الخطوة التالية.
      - name: Destroy keyed-smoke credential state
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/h2a_smoke_token" /tmp/h2a_record_proof.log \
                /tmp/h2a_trash.json || true
          # **وأداةُ الفحص تُمحى قبل رحلةِ المتصفّح**، فتبقى الشجرةُ التي
          # يفحصها المتصفّحُ هي المنتجَ المنشورَ وحدَه.
          rm -rf "${RUNNER_TEMP}/h2a-harness" || true
          echo "keyed-smoke temporary state and staged harness destroyed"

      # ــ ٥ · الرحلة، على الإنتاج المنشور ــ
      - name: Authenticated golden journey
        run: cd apps/web && npm run test:acceptance
        env:
          PUBRIVA_WEB_URL: https://pubriva.com

      # ــ ٤ · ولا يُرفع أثرٌ من رحلةٍ باعتماد، ولو سقطت ــ
      #
      # المسجّلاتُ مُطفأة، لكنّ `error-context.md` يُكتب على أيّ حال ويحمل
      # لقطةَ DOM لصفحةٍ فيها حقولُ اعتماد. فتُمحى قبل أيّ رفع، ويبقى سجلُّ
      # الطرفية وحده — وهو يكفي لمعرفة أين سقطت.
      - name: Destroy acceptance artifacts
        if: always()
        run: rm -rf apps/web/playwright-report apps/web/test-results

      - name: Say plainly what this proves, and what it does not
        if: success()
        env:
          PROJECT_ID: ${{ steps.keyed.outputs.project_id }}
          KEY_DIGEST: ${{ steps.keyed.outputs.key_digest }}
          CLEANUP_STATUS: ${{ steps.cleanup.outputs.cleanup_status }}
          PRODUCT_SHA: ${{ inputs.expected_release_sha }}
        run: |
          {
            echo "### AUTOMATED PRODUCT ACCEPTANCE GREEN"
            echo ""
            echo "product under test (deployed): \`${PRODUCT_SHA}\`"
            echo ""
            echo "acceptance harness: \`${GITHUB_SHA}\`"
            echo ""
            echo "#### H2-A KEYED REPLAY SMOKE GREEN"
            echo ""
            echo "| claim | result |"
            echo "|---|---|"
            echo "| same key + same request | replayed |"
            echo "| same resource id | PASS |"
            echo "| \`Idempotency-Replayed: true\` | PASS |"
            echo "| active domain rows for this smoke | 1 |"
            echo "| completed idempotency records | 1 |"
            echo "| record read under actor+tenant RLS | PASS |"
            echo "| read-only inspection transaction | PASS |"
            echo "| disposable project | ${CLEANUP_STATUS} (product trash route) |"
            echo ""
            echo "smoke project: \`${PROJECT_ID}\` · key digest: \`${KEY_DIGEST}\`"
            echo ""
            echo "**What this proves:** on deployed production, a repeated"
            echo "\`POST /api/v1/workspace/projects\` carrying one"
            echo "\`Idempotency-Key\` mutates once and replays the original"
            echo "response, and the durable record is readable by its own actor"
            echo "through the tenant+actor row policy."
            echo ""
            echo "**What it does NOT prove:** the other three H2-A routes in"
            echo "production, H2-B, Web key adoption, exactly-once external"
            echo "effects, or outbox guarantees. RC-T1-H2 is **not** closed."
            echo ""
            echo "This does **not** declare PRODUCTION GREEN."
            echo "That remains the owner's own golden journey (runbook §9)."
          } >> "$GITHUB_STEP_SUMMARY"
