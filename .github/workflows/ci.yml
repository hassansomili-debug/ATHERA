name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  api:
    name: API — اختبارات القبول | acceptance tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: athera_owner
          POSTGRES_PASSWORD: athera_owner_pw
          POSTGRES_DB: athera
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U athera_owner -d athera"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # قاعدة الاختبارات: يكتب فيها pytest بيانات قبولٍ حقيقية وتبقى.
      DATABASE_URL: postgresql+asyncpg://athera_app:athera_app_pw@localhost:5432/athera
      DATABASE_MIGRATION_URL: postgresql+psycopg://athera_owner:athera_owner_pw@localhost:5432/athera
      # قاعدة تدريب الترحيل: نظيفة، ومنفصلة، ولا تلمسها الاختبارات.
      #
      # **ولماذا الفصل؟** لأن التدريب كان يجري على قاعدة الاختبارات نفسها،
      # فيصطدم `downgrade base` ببيانات قبولٍ صحيحة. وحين تركت اختبارات S5C
      # ستة مرشّحين بحالة «لا أعرف» رفض الترحيل 0016 التنازل — **وكان محقًّا**:
      # تحويلها إلى «مرفوض» إتلافُ قرار بشري. فالعطب في عزل التدريب لا في
      # الحارس، وإصلاحه بإضعاف الحارس كان سيبدّد الضمان الذي وُجد لأجله.
      MIGRATION_DRILL_URL: postgresql+psycopg://athera_owner:athera_owner_pw@localhost:5432/athera_migration
      # دورُ اختبارٍ **يتجاوز RLS عمدًا** — في قاعدة الاختبار وحدها.
      #
      # كل الاختبارات كانت تعمل بـ`athera_app` الذي لا يتجاوز، فكانت القاعدة
      # ترشّح نيابةً عن التطبيق وتخفي أن التطبيق لا يرشّح. وحين اتّصل الإنتاج
      # بدورٍ متجاوز سقطت الطبقة الوحيدة ولم يكن خلفها شيء. فهذا الدور يسأل
      # السؤال الذي لم يُسأل: لو سقطت القاعدة، هل يمنع التطبيق؟
      #
      # كلمته قيمة CI لا سرّ إنتاج، ولا تُستعمل بيانات اعتماد إنتاجية بحال.
      ATHERA_TEST_BYPASSRLS_URL: postgresql+asyncpg://athera_test_bypass:athera_test_bypass_pw@localhost:5432/athera
      JWT_SECRET: ci-only-not-a-real-secret
      MODEL_PROVIDER: "null"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # **حزم المزودين تُثبَّت أيضًا** — بلا مفتاح وبلا شبكة.
      #
      # `test_at_s5b_anthropic_contract.py` يقرأ توقيع الـSDK المثبَّت
      # ويقابله بما يبنيه المحوّل. وبغياب الحزمة كان يُتخطّى بأكمله —
      # فيصمت الاختبار الوحيد الذي يلتقط الانحدار الذي أوقف الإنتاج فعلًا:
      # `anthropic` 1.x أزالت `temperature`، وكل الاختبارات الأخرى تتحدث
      # إلى مزوّد وهمي يقبل كل شيء.
      #
      # ولا يغيّر هذا سلوك التشغيل: `MODEL_PROVIDER=null` كما هو، ولا
      # بيانات اعتماد. وجود الحزمة يسمح بقراءة عقدها لا باستدعائها.
      - run: pip install -e "apps/api[dev,providers]"
      - name: Migrate (RLS + append-only audit)
        run: cd infra/db && alembic upgrade head
      # يُنشأ **بعد** الترحيل: صلاحياته تأتي بعضوية `athera_app` لا بمنحٍ
      # مكرّر، فيرث ما لدور التطبيق — بما فيه سجلّ التدقيق المقيَّد بالإضافة —
      # ويضيف التجاوز وحده. فما يُختبر هو فرق طبقةٍ واحدة لا فرق صلاحيات.
      - name: Create a BYPASSRLS test role (test database only)
        env:
          PGPASSWORD: athera_owner_pw
        run: |
          psql -h localhost -U athera_owner -d athera -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'athera_test_bypass') THEN CREATE ROLE athera_test_bypass LOGIN PASSWORD 'athera_test_bypass_pw' BYPASSRLS; END IF; END \$\$;" \
            -c "GRANT USAGE ON SCHEMA public TO athera_test_bypass" \
            -c "GRANT athera_app TO athera_test_bypass"
          # `boolean || text` يعطي 'true'/'false' لا 't'/'f' — وتلك الأخيرة
          # طريقة **عرض** psql لعمود منطقي، لا قيمته النصّية.
          posture=$(psql -h localhost -U athera_owner -d athera -tAc \
            "SELECT rolsuper::text || '/' || rolbypassrls::text FROM pg_roles WHERE rolname='athera_test_bypass'")
          echo "athera_test_bypass rolsuper/rolbypassrls: $posture"
          test "$posture" = "false/true" || { echo "::error::the test role is not a plain BYPASSRLS role (got '$posture')"; exit 1; }

      - name: Lint
        run: cd apps/api && ruff check .
      - name: Architecture boundaries (§38.6.8 / ADR-0003)
        run: cd apps/api && lint-imports
      - name: Acceptance tests AT-S0-*
        run: cd apps/api && pytest -v

      # ── تدريب الترحيل: على قاعدة نظيفة مخصَّصة ──
      #
      # `DATABASE_MIGRATION_URL` هي الآلية القائمة التي يقرأها `env.py`؛
      # تُوجَّه هنا إلى قاعدة أخرى بدل أن تُخترع آلية ثانية.
      - name: Create a clean migration-drill database
        env:
          PGPASSWORD: athera_owner_pw
        run: |
          psql -h localhost -U athera_owner -d postgres \
            -c 'DROP DATABASE IF EXISTS athera_migration' \
            -c 'CREATE DATABASE athera_migration'

      - name: Assert the drill database is empty before the drill
        env:
          PGPASSWORD: athera_owner_pw
        run: |
          tables=$(psql -h localhost -U athera_owner -d athera_migration -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables in athera_migration: $tables"
          test "$tables" = "0" || { echo "::error::drill database is not clean"; exit 1; }

      - name: Migration roundtrip drill (AT-S0-13) — head → base → head
        env:
          DATABASE_MIGRATION_URL: ${{ env.MIGRATION_DRILL_URL }}
        run: |
          cd infra/db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Assert the drill reached the repository head and left the test database untouched
        env:
          PGPASSWORD: athera_owner_pw
        run: |
          # **الرأس المتوقّع يُشتقّ ولا يُثبَّت نصًّا.**
          #
          # كان مكتوبًا `0016` حرفيًّا، فسقطت هذه الخطوة عند أول ترحيل بعده
          # — والتدريب نفسه كان ناجحًا. تأكيدٌ يحمل رقمًا محفوظًا يقيس عمر
          # الملف لا صحّة الترحيل، ويطلب تعديلًا يدويًّا مع كل إضافة.
          expected=$(cd infra/db && alembic heads 2>/dev/null \
            | grep -oE '^[0-9]+' | head -1)
          test -n "$expected" || { echo "::error::could not read alembic head"; exit 1; }
          head=$(psql -h localhost -U athera_owner -d athera_migration -tAc \
            "SELECT version_num FROM alembic_version")
          echo "drill head: $head · repository head: $expected"
          test "$head" = "$expected" \
            || { echo "::error::drill head is $head, expected $expected"; exit 1; }

          # بيانات القبول باقية كما تركتها الاختبارات — التدريب لم يمسّها.
          unknown=$(psql -h localhost -U athera_owner -d athera \
            -tAc "SELECT count(*) FROM fact_candidates WHERE status = 'unknown'")
          echo "unknown candidates still in the test database: $unknown"
          test "$unknown" -ge 1 || {
            echo "::error::the drill mutated the acceptance-test database"; exit 1; }

          # وحارس حالات القرار ما يزال قائمًا على قاعدة الاختبارات.
          psql -h localhost -U athera_owner -d athera -tAc \
            "SELECT pg_get_constraintdef(oid) FROM pg_constraint
             WHERE conname = 'ck_fact_candidates_ck_candidate_status'" | grep -q unknown || {
            echo "::error::the status constraint changed on the test database"; exit 1; }

  web:
    name: Web — ثنائي اللغة | bilingual build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd apps/web && npm ci
      - run: cd apps/web && npm run typecheck
      - run: cd apps/web && npm run lint
      - run: cd apps/web && npm run build

  security:
    name: Security — أسرار وتبعيات | secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scanning (AT-S0-10)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependency audit
        run: pip install pip-audit && pip-audit -r <(pip install -e apps/api --dry-run --report - 2>/dev/null || echo "") || true
